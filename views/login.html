<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gaming Hub</title>
  <link rel="stylesheet" href="/css/game.css">
</head>
<body>

  <div class="main-card" style="max-width: 420px;">
    <h2 style="margin-bottom: 20px;">Welcome Back</h2>
    
    <form id="loginForm">
      <div class="form-group">
        <label>Email / Name</label>
        <input type="text" class="form-control" placeholder="Enter username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary">Login & Play</button>
    </form>
  </div>

</body>
</html>
