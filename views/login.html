<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kanika Medical</title>
  <link rel="stylesheet" href="/css/Data.css">
</head>
<body>

  <div class="navbar">
    <a href="/" class="logo">
      <span class="logo-badge">💊</span>
      <span>KANIKA MEDICAL</span>
    </a>
  </div>

  <div class="container" style="max-width: 450px;">
    <div class="medical-card">
      <h2 style="color: #166534; text-align: center; margin-bottom: 20px;">🔐 অ্যাকাউন্ট লগইন</h2>
      
      <form action="/login" method="POST">
        <div class="form-group">
          <label>ইমেইল ঠিকানা</label>
          <input type="email" name="email" class="form-control" placeholder="আপনার ইমেইল দিন" required>
        </div>

        <div class="form-group">
          <label>পাসওয়ার্ড</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">লগইন করুন</button>
      </form>
    </div>
  </div>

</body>
</html>
