<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন - SPPC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans Bengali', 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .login-card h2 {
      font-size: 1.6rem;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 14px 18px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-control:focus {
      border-color: #6366f1;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🔐 অ্যাকাউন্ট লগইন</h2>
    
    <!-- Express Server-এর /login endpoint-এ স্ট্যান্ডার্ড HTML Form Submit -->
    <form action="/login" method="POST">
      <div class="form-group">
        <label>ইমেইল ঠিকানা</label>
        <input type="email" name="email" class="form-control" placeholder="আপনার ইমেইল দিন" required>
      </div>

      <div class="form-group">
        <label>পাসওয়ার্ড</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">লগইন করুন</button>
    </form>
  </div>

</body>
</html>
