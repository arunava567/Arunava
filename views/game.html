<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Paper Pencil Scissor Game</title>
  <link rel="stylesheet" href="/css/Data.css">
  <style>
    .game-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 25px 0;
    }

    .choice-btn {
      background: #f0fdf4;
      border: 2px solid #86efac;
      border-radius: 14px;
      padding: 15px 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #166534;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .choice-btn:hover {
      background: #22c55e;
      color: white;
      border-color: #22c55e;
      transform: translateY(-3px);
    }

    @media (max-width: 500px) {
      .game-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="user-info">
      <img id="userImg" src="https://via.placeholder.com/42" alt="User">
      <div>
        <h4 id="userName" style="color: #166534;">খেলোয়াড়</h4>
        <small id="userEmail" style="color: #64748b;"></small>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="coin-badge">
        🪙 <span id="coins">0</span> Coins
      </div>
      <button class="btn btn-danger" onclick="logout()" style="padding: 6px 12px; font-size: 0.85rem;">🚪 লগআউট</button>
    </div>
  </div>

  <div class="container" style="max-width: 650px;">
    <div class="medical-card" style="text-align: center;">
      <h2 style="color: #166534;">🎮 Stone Paper Pencil Scissor</h2>
      <p style="color: #64748b; margin-top: 5px;">চাল বেছে নিয়ে কয়েন জিতুন</p>

      <div class="game-grid">
        <button class="choice-btn" onclick="play('stone')">
          <span style="font-size: 1.8rem;">🪨</span> Stone
        </button>
        <button class="choice-btn" onclick="play('paper')">
          <span style="font-size: 1.8rem;">📄</span> Paper
        </button>
        <button class="choice-btn" onclick="play('pencil')">
          <span style="font-size: 1.8rem;">✏️</span> Pencil
        </button>
        <button class="choice-btn" onclick="play('scissor')">
          <span style="font-size: 1.8rem;">✂️</span> Scissor
        </button>
      </div>

      <div id="choices" style="color: #64748b; margin-bottom: 10px;">কয়েন জিততে খেলা শুরু করুন!</div>
      <div id="result" style="font-size: 1.3rem; font-weight: 700; min-height: 30px;"></div>
    </div>
  </div>

  <script>
    const youdict = { stone: 1, paper: 2, pencil: 3, scissor: 4 };
    const reverseDict = { 1: 'Stone', 2: 'Paper', 3: 'Pencil', 4: 'Scissor' };
    
    let coins = 0;
    const email = localStorage.getItem("userEmail");

    if (!email) {
      alert("⚠️ প্রথমে লগইন করুন!");
      window.location.href = "/login";
    } else {
      fetch('/get-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('userName').innerText = data.name || "Player";
        document.getElementById('userEmail').innerText = data.email || "";
        document.getElementById('userImg').src = data.imgUrl || "https://via.placeholder.com/42";
        coins = parseInt(data.coins) || 0;
        document.getElementById("coins").innerText = coins;
      })
      .catch(err => console.error("User Load Error:", err));
    }

    async function updateCoins() {
      await fetch('/update-coins', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, coins })
      });
    }

    function play(userChoice) {
      const user = youdict[userChoice];
      const computer = Math.floor(Math.random() * 4) + 1;

      document.getElementById("choices").innerText =
        `You chose ${reverseDict[user]}. Computer chose ${reverseDict[computer]}.`;

      let result = "";
      const resultElem = document.getElementById("result");

      if (user === computer) {
        result = "It's a Draw";
        resultElem.style.color = "#d97706";
      } else if (
        (computer === 1 && user === 2) || (computer === 3 && user === 1) ||
        (computer === 4 && user === 1) || (computer === 2 && user === 4) ||
        (computer === 2 && user === 3) || (computer === 4 && user === 3)
      ) {
        result = "You Win";
        resultElem.style.color = "#16a34a";
        coins += 1;
      } else {
        result = "You Lose";
        resultElem.style.color = "#dc2626";
        coins -= 1;
      }

      resultElem.innerText = result;
      document.getElementById("coins").innerText = coins;

      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(`You chose ${reverseDict[user]}, computer chose ${reverseDict[computer]}. ${result}`);
      window.speechSynthesis.speak(msg);

      updateCoins();
    }

    function logout() {
      if (confirm("আপনি কি নিশ্চিত যে লগআউট করতে চান?")) {
        localStorage.removeItem("userEmail");
        window.location.href = "/login";
      }
    }
  </script>
</body>
</html>
