<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Paper Scissors Game</title>
  <link rel="stylesheet" href="/css/game.css">
</head>
<body>

  <!-- Top Navigation / User Header -->
  <div class="navbar">
    <div class="user-profile">
      <img id="userImg" src="https://via.placeholder.com/45" alt="User Avatar">
      <div>
        <h4 id="userName">User Name</h4>
        <small style="color: #94a3b8;">Player</small>
      </div>
    </div>
    <div class="coin-badge">
      🪙 <span id="coinCount">0</span> Coins
    </div>
  </div>

  <!-- Game Card Arena -->
  <div class="main-card">
    <h2 style="margin-bottom: 10px; color: #f8fafc;">Stone Paper Scissors</h2>
    <p style="color: #94a3b8; margin-bottom: 25px;">জিতলে কয়েন +১, হারলে কয়েন -১</p>

    <div class="game-arena">
      <button class="choice-btn" onclick="playGame('stone')">🪨</button>
      <button class="choice-btn" onclick="playGame('paper')">📄</button>
      <button class="choice-btn" onclick="playGame('scissors')">✂️</button>
    </div>

    <div id="resultBox" style="margin-top: 20px; font-size: 1.2rem; font-weight: 600; min-height: 40px;">
      আপনার চাল বেছে নিন!
    </div>
  </div>

</body>
</html>
