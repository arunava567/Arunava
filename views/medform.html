<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicine Request Form</title>
  <link rel="stylesheet" href="/css/game.css">
</head>
<body>

  <div class="main-card">
    <h2 style="margin-bottom: 20px;">Kanika Medical Order</h2>

    <form id="medForm">
      <div class="form-group">
        <label>Patient Name</label>
        <input type="text" class="form-control" placeholder="Full Name" required>
      </div>

      <div class="form-group">
        <label>Medicine Details</label>
        <textarea class="form-control" rows="3" placeholder="Enter medicine names and quantity..."></textarea>
      </div>

      <button type="submit" class="btn-primary">Submit Order</button>
    </form>
  </div>

</body>
</html>
