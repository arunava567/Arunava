<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicine Order - Kanika Medical</title>
  <link rel="stylesheet" href="/css/Data.css">
</head>
<body>

  <!-- Header / Navbar -->
  <div class="navbar">
    <a href="/" class="logo">
      <span class="logo-badge">K</span>
      <div>
        <span>KANIKA MEDICAL</span>
        <small>MEDICAL CENTER</small>
      </div>
    </a>
    <div style="display: flex; gap: 10px;">
      <a href="/index" class="btn btn-secondary" style="border: 1px solid #cbd5e1;">🔐 হোম</a>
      <a href="/medform" class="btn btn-primary">📝 অর্ডার দিন</a>
    </div>
  </div>

  <div class="container" style="max-width: 600px;">
      <div class="medical-card">
  <!-- ফর্মের ভেতরের হেডার লোগোসহ -->
  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 25px; border-bottom: 2px solid #f0fdf4; padding-bottom: 15px;">
    <div class="logo-badge" style="width: 40px; height: 40px; font-size: 1.3rem;">K</div>
    <div>
      <h2 style="color: #166534; font-size: 1.3rem; margin: 0;">ওষুধের জন্য রিকুয়েস্ট করুন</h2>
      <small style="color: #15803d; font-weight: 600; letter-spacing: 1px;">KANIKA MEDICAL CENTER</small>
    </div>
  </div>

      <form action="/submit-med" method="POST">
        <div class="form-group">
          <label>রোগীর নাম</label>
          <input type="text" name="name" class="form-control" placeholder="রোগীর নাম লিখুন" required>
        </div>

        <div class="form-group">
          <label>ফোন নম্বর</label>
          <input type="tel" name="phone" class="form-control" placeholder="ফোন নাম্বার" required>
        </div>

        <div class="form-group">
          <label>ঠিকানা</label>
          <input type="text" name="address" class="form-control" placeholder="সম্পূর্ণ ঠিকানা" required>
        </div>

        <div class="form-group">
          <label>ওষুধের নাম ও পরিমাণ</label>
          <textarea name="medicine" class="form-control" rows="3" placeholder="ওষুধের নাম লিখুন..." required></textarea>
        </div>

        <div class="form-group">
          <label>তারিখ</label>
          <input type="date" name="date" class="form-control" required>
        </div>

        <div class="form-group">
          <label>প্রেসক্রিপশনের ছবি/লিঙ্ক (URL)</label>
          <input type="url" name="imgUrl" class="form-control" placeholder="https://..." required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">অর্ডার নিশ্চিত করুন</button>
      </form>
    </div>
  </div>

</body>
</html>
